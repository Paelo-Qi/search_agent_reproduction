# Gate-only: one prompt, n=2, ONE real policy optimizer update. Not smoke20/main400.
gate_version: minimum-rl-integration-c-v2-actor-recomputed-old-logprob
rollout_n: 2
actor_world_size: 2
optimizer_steps: 1
learning_rate: 1.0e-6
weight_decay: 0.0
clip_ratio_low: 0.2
clip_ratio_high: 0.28
entropy_coeff: 0.0
vllm:
  tensor_parallel_size: 1
  max_model_len: 8192
  max_new_tokens: 512
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  gpu_memory_utilization: 0.6
agent:
  max_turns: 16
