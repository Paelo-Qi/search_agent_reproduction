project:
  seed: 20260506
  output_dir: outputs/sft_main
  report_dir: reports/sft_main

model:
  name_or_path: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false
  image_max_pixels: 262144
  freeze_vision_tower: true
  freeze_multimodal_projector: true

data:
  pool_dir: data/sft_main
  max_length: 32000
  epochs_per_shard: 2

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  world_size: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  weight_decay: 0.0
  logging_steps: 1
  save_every_steps: 50
  gradient_checkpointing: true
  bf16: true
  tf32: true
  dataloader_num_workers: 0

scheduler:
  phase_1:
    type: cosine
    warmup_ratio: 0.1
    peak_lr: 0.0002
  phase_2:
    type: cosine
    warmup_ratio: 0.1
    peak_lr: null  # Must be chosen explicitly after the 4k health check.
