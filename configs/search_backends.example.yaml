search:
  serper:
    endpoint: https://google.serper.dev/search
    api_key_env: SERPER_API_KEY
    timeout_seconds: 30
  jina_reader:
    endpoint_prefix: https://r.jina.ai/
    api_key_env: JINA_API_KEY
    timeout_seconds: 30
  serpapi:
    upload_endpoint: https://serpapi.com/image
    lens_endpoint: https://serpapi.com/search
    api_key_env: SERPAPI_API_KEY
    timeout_seconds: 30
  text_search:
    default_top_k: 5
    max_top_k: 10
    max_chars_per_page: 6000
    max_total_chars: 20000
  web_search:
    max_results: 5
  image_search:
    max_results: 10
